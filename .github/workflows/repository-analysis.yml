name: Monthly Repository Analysis

on:
  schedule:
    - cron: '0 0 1 * *'  # Run on the 1st day of every month at midnight UTC
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # Required to push to analysis branch

env:
  REPOSITORIES: ${{ vars.REPOSITORIES }}  # Comma-separated list of users/orgs or specific repos
  USERNAMES: ${{ vars.USERNAMES }}  # Comma-separated usernames for statistics aggregation
  MAX_THREADS: ${{ vars.MAX_THREADS || '4' }}  # Number of parallel threads (default: 4)
  CACHE_HOURS: ${{ vars.CACHE_HOURS || '3' }}  # Cache duration in hours (default: 3)
  INCLUDE_PRIVATE_REPOS: ${{ vars.INCLUDE_PRIVATE_REPOS || 'false' }}  # Include private repos (default: false)

jobs:
  analyze-repositories:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true

    - name: Setup statistics directory with previous results
      run: |
        mkdir -p statistics

        # Try to fetch existing analysis branch and copy previous results
        if git ls-remote --heads origin analysis | grep -q analysis; then
          echo "Found existing analysis branch. Fetching previous results..."

          # Fetch the analysis branch
          git fetch origin analysis:analysis || true

          # Copy previous statistics if they exist
          if git checkout analysis -- statistics/ 2>/dev/null; then
            echo "Successfully restored previous statistics files"
            ls -la statistics/ || echo "No previous statistics files found"
          else
            echo "No previous statistics to restore"
          fi

          # Return to main branch
          git checkout main
        else
          echo "No existing analysis branch found. Starting fresh."
        fi

    - name: Analyze repositories
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        REPOSITORIES: ${{ env.REPOSITORIES }}
        MAX_THREADS: ${{ env.MAX_THREADS }}
        CACHE_HOURS: ${{ env.CACHE_HOURS }}
        INCLUDE_PRIVATE_REPOS: ${{ env.INCLUDE_PRIVATE_REPOS }}
      run: bundle exec ruby scripts/analyze_repositories.rb

    - name: Aggregate statistics
      env:
        USERNAMES: ${{ env.USERNAMES }}
      run: bundle exec ruby scripts/aggregate_statistics.rb

    - name: Create single orphan commit on analysis branch
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Store current statistics in a temporary location
        if [ -d "statistics" ] && [ "$(ls -A statistics 2>/dev/null)" ]; then
          echo "Backing up current statistics..."
          cp -r statistics /tmp/statistics_backup
          echo "Statistics files to backup:"
          ls -la /tmp/statistics_backup/ || echo "No files found"
        else
          echo "No statistics files found to backup"
          mkdir -p /tmp/statistics_backup
        fi

        # Always create a fresh orphan branch (no history)
        echo "Creating fresh orphan analysis branch..."
        git checkout --orphan analysis-temp

        # Remove all files from staging and working directory
        git rm -rf --cached . 2>/dev/null || true
        git clean -fdx

        # Copy statistics from backup
        if [ -d "/tmp/statistics_backup" ] && [ "$(ls -A /tmp/statistics_backup 2>/dev/null)" ]; then
          echo "Restoring statistics from backup..."
          cp -r /tmp/statistics_backup statistics
          echo "Restored statistics files:"
          ls -la statistics/ || echo "No files in statistics directory"
        else
          echo "No statistics to restore, creating empty directory"
          mkdir -p statistics
        fi

        # Add statistics files
        git add statistics/

        # Check what will be committed
        echo "Files to be committed:"
        git diff --cached --name-only || echo "No files staged"

        # Commit with detailed message including any errors
        commit_msg="Repository statistics analysis - $(date +'%Y-%m-%d %H:%M:%S UTC')"

        if [ -f "statistics/error_report.json" ]; then
          error_count=$(grep -o '"total_errors":[0-9]*' statistics/error_report.json 2>/dev/null | cut -d':' -f2 || echo "0")
          if [ "$error_count" -gt 0 ] 2>/dev/null; then
            commit_msg="$commit_msg (${error_count} errors encountered)"
          else
            commit_msg="$commit_msg (errors resolved)"
          fi
        fi

        git commit -m "$commit_msg" --allow-empty

        # Delete existing analysis branch if it exists and push the new one
        git branch -D analysis 2>/dev/null || true
        git branch -m analysis-temp analysis
        git push origin analysis --force
